name: Build sullaworks image
on:
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - '.github/workflows/hub.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/merchantprotocol/sullaworks:latest
            ghcr.io/merchantprotocol/sullaworks:${{ github.sha }}
          cache-from: type=gha,scope=sullaworks
          cache-to: type=gha,mode=max,scope=sullaworks
